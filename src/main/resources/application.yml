server:
  port: ${PORT:8082}

spring:
  application:
    name: artagram-users

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_usuarios}
    username: ${DB_USER:artagram}
    password: ${DB_PASSWORD:artagram}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:artagram}
    password: ${RABBITMQ_PASSWORD:artagram_secret}

artagram:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:../artagram-infra/secrets-dev/jwt-public.pem}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    jwks-url: ${JWKS_URL:http://localhost:8081/.well-known/jwks.json}
  storage:
    type: ${STORAGE_TYPE:s3}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:artagram-uploads}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: true
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
  pago:
    proveedor: ${PAGO_PROVEEDOR:fake}
    mercadopago-access-token: ${MP_ACCESS_TOKEN:}
  observability:
    grafana-tecnico-url: ${GRAFANA_URL:http://localhost:3001}/d/artagram-tecnico
    grafana-negocio-url: ${GRAFANA_URL:http://localhost:3001}/d/artagram-negocio
    prometheus-url: ${PROMETHEUS_URL:http://localhost:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
