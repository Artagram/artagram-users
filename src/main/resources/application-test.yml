server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:users_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

artagram:
  jwt:
    public-key-path: classpath:secrets-test/jwt-public.pem
  storage:
    type: disk
    local-dir: target/test-uploads
